name: PR merge policy

# Enforces diffmeter's objective merge/close criteria (see CONTRIBUTING.md):
# a PR merges itself once every required check in ci.yml passes AND it only
# touches paths on the auto-merge allowlist below, and closes itself if
# checks never pass within a fixed window regardless of what it touches.
# Passing checks is necessary but not sufficient for auto-merge -- checks
# can confirm a change is substantive and tested, not that it's the *right*
# change, so anything touching real application code, the composite Action,
# CI/CD itself, or packaging/dependency config always waits for a human to
# click merge, no matter how clean its CI run is.

on:
  pull_request:
    types: [opened, reopened, synchronize]
  schedule:
    - cron: "17 6 * * *"

permissions:
  pull-requests: write
  contents: read

jobs:
  enable-auto-merge:
    # Only sets the auto-merge flag -- GitHub itself withholds the actual
    # merge until every required status check (see ci.yml's
    # `required-checks` job) reports success. This is the safe, native
    # mechanism: it never runs any code from the PR with elevated
    # privileges, unlike a custom merge script would risk doing.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check whether this PR only touches auto-merge-eligible paths
        id: eligibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Auto-merge allowlist: tests, docs, and issue/PR templates only.
          # Everything else -- src/diffmeter/** (the actual library/CLI),
          # action.yml (the external-facing composite Action contract),
          # .github/workflows/** (CI/CD itself -- letting a PR modify its
          # own gate and then have that gate auto-merge it would be a real
          # supply-chain hole, not a hypothetical one), and pyproject.toml
          # (dependencies/packaging) -- requires a human to click merge,
          # regardless of how clean the CI run is. This is a read (listing
          # files), so plain GITHUB_TOKEN is enough -- no PAT needed here.
          eligible=true
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              tests/*|*.md|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE.md)
                ;;
              *)
                echo "Not eligible for auto-merge: touches '$file', outside the allowlist."
                eligible=false
                ;;
            esac
          done < <(gh pr view "$PR_URL" --json files --jq '.files[].path')
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge for this PR
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          # GITHUB_TOKEN structurally cannot call the enablePullRequestAutoMerge
          # GraphQL mutation -- confirmed the hard way: it failed with
          # "Resource not accessible by integration" even after granting
          # pull-requests: write in this workflow's `permissions:` block AND
          # enabling the repo's "Allow GitHub Actions to create and approve
          # pull requests" setting. GitHub restricts that specific mutation to
          # real user-associated tokens, not the workflow-default token, no
          # matter what it's granted. PR_AUTOMERGE_TOKEN is a fine-grained PAT
          # (pull-requests: read/write, scoped to only this repo) added as a
          # repo secret for exactly this reason.
          GH_TOKEN: ${{ secrets.PR_AUTOMERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # A PAT stored as a repo secret is still never exposed to a
          # `pull_request`-triggered run from a fork -- GitHub withholds all
          # secrets from fork PRs on this event type, precisely to stop an
          # untrusted PR from exfiltrating one or using it to grant itself
          # merge rights. So this still only succeeds for same-repo PRs; a
          # fork PR needs a maintainer to run `gh pr merge --auto` by hand.
          gh pr merge --auto --squash "$PR_URL" \
            || echo "::warning::Could not enable auto-merge automatically (likely a fork PR, which never receives PR_AUTOMERGE_TOKEN; or the secret is missing/misscoped). A maintainer must run 'gh pr merge --auto' manually for this PR."

      - name: Note that this PR needs manual review instead
        if: steps.eligibility.outputs.eligible != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # This job re-runs on every push (synchronize), so guard against
          # leaving a duplicate comment each time -- only post once per PR.
          already_noted=$(gh pr view "$PR_URL" --json comments \
            --jq '[.comments[].body | select(contains("outside the auto-merge allowlist"))] | length')
          if [ "$already_noted" = "0" ]; then
            gh pr comment "$PR_URL" --body "This PR touches paths outside the auto-merge allowlist (tests/, *.md, issue/PR templates), so it needs a maintainer to merge it by hand even once checks pass -- see CONTRIBUTING.md's \"Objective merge criteria\" section." \
              || echo "::warning::Could not comment (likely a fork PR without write access to GITHUB_TOKEN)."
          fi

  close-stale-prs:
    # The other half of "no maintainer discretion": a PR that hasn't merged
    # -- meaning it hasn't passed every required check -- within a fixed
    # window closes automatically instead of sitting open for a human to
    # triage. 7 days to go stale, 3 more to close: enough time for a real
    # contributor to push a fix, not indefinite.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 7
          days-before-pr-close: 3
          stale-pr-message: >
            This PR hasn't merged within 7 days, which means it hasn't yet
            passed diffmeter's objective merge criteria (tests, the
            coverage floor, and diffmeter's own --min-score gate on the
            diff -- see CONTRIBUTING.md). It will close automatically in 3
            more days unless it starts passing.
          close-pr-message: >
            Closing automatically: this PR did not meet diffmeter's
            objective merge criteria within the review window. Reopen it
            (or open a new PR) once it passes tests, the coverage floor,
            and diffmeter's own --min-score gate on the diff.

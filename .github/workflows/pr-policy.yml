name: PR merge policy

# Enforces diffmeter's objective merge/close criteria (see CONTRIBUTING.md):
# a PR merges itself once every required check in ci.yml passes, and closes
# itself if it never does within a fixed window. Neither direction involves
# a maintainer reading the PR and making a judgment call.

on:
  pull_request:
    types: [opened, reopened, synchronize]
  schedule:
    - cron: "17 6 * * *"

permissions:
  pull-requests: write
  contents: read

jobs:
  enable-auto-merge:
    # Only sets the auto-merge flag -- GitHub itself withholds the actual
    # merge until every required status check (see ci.yml's
    # `required-checks` job) reports success. This is the safe, native
    # mechanism: it never runs any code from the PR with elevated
    # privileges, unlike a custom merge script would risk doing.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for this PR
        env:
          # GITHUB_TOKEN structurally cannot call the enablePullRequestAutoMerge
          # GraphQL mutation -- confirmed the hard way: it failed with
          # "Resource not accessible by integration" even after granting
          # pull-requests: write in this workflow's `permissions:` block AND
          # enabling the repo's "Allow GitHub Actions to create and approve
          # pull requests" setting. GitHub restricts that specific mutation to
          # real user-associated tokens, not the workflow-default token, no
          # matter what it's granted. PR_AUTOMERGE_TOKEN is a fine-grained PAT
          # (pull-requests: read/write, scoped to only this repo) added as a
          # repo secret for exactly this reason.
          GH_TOKEN: ${{ secrets.PR_AUTOMERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # A PAT stored as a repo secret is still never exposed to a
          # `pull_request`-triggered run from a fork -- GitHub withholds all
          # secrets from fork PRs on this event type, precisely to stop an
          # untrusted PR from exfiltrating one or using it to grant itself
          # merge rights. So this still only succeeds for same-repo PRs; a
          # fork PR needs a maintainer to run `gh pr merge --auto` by hand.
          gh pr merge --auto --squash "$PR_URL" \
            || echo "::warning::Could not enable auto-merge automatically (likely a fork PR, which never receives PR_AUTOMERGE_TOKEN; or the secret is missing/misscoped). A maintainer must run 'gh pr merge --auto' manually for this PR."

  close-stale-prs:
    # The other half of "no maintainer discretion": a PR that hasn't merged
    # -- meaning it hasn't passed every required check -- within a fixed
    # window closes automatically instead of sitting open for a human to
    # triage. 7 days to go stale, 3 more to close: enough time for a real
    # contributor to push a fix, not indefinite.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 7
          days-before-pr-close: 3
          stale-pr-message: >
            This PR hasn't merged within 7 days, which means it hasn't yet
            passed diffmeter's objective merge criteria (tests, the
            coverage floor, and diffmeter's own --min-score gate on the
            diff -- see CONTRIBUTING.md). It will close automatically in 3
            more days unless it starts passing.
          close-pr-message: >
            Closing automatically: this PR did not meet diffmeter's
            objective merge criteria within the review window. Reopen it
            (or open a new PR) once it passes tests, the coverage floor,
            and diffmeter's own --min-score gate on the diff.

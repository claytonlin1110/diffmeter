name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install diffmeter
        run: pip install -e ".[dev]"

      - name: Run tests
        # --cov enforces pyproject.toml's [tool.coverage.report] fail_under
        # -- objective merge criterion #1 (see CONTRIBUTING.md): a PR that
        # drops coverage below the floor fails this job the same way a
        # failing assertion would, no maintainer judgment call needed.
        run: pytest -v --cov --cov-report=term-missing

  diffmeter-self-score:
    # Objective merge criterion #2: diffmeter scores its own diff, built
    # from this PR's own code (not a prior release), so the gate always
    # reflects what's actually about to be merged. Threshold of 30 matches
    # the README's own documented CI-gate example, not a number invented
    # just for this job.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install diffmeter from this PR's own code
        run: pip install -e .

      - name: Score this PR's diff against its base
        run: diffmeter score --base "origin/${{ github.base_ref }}" --min-score 30

  required-checks:
    # Single aggregator so branch protection only has to require one named
    # check instead of every individual matrix cell -- see CONTRIBUTING.md's
    # "Objective merge criteria" section for what this job's success
    # actually certifies.
    if: always()
    needs: [test, test-action, diffmeter-self-score]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every required job succeeded
        # Bracket notation, not `needs.test-action.result` -- job IDs with
        # hyphens aren't safe to assume work with dot notation in GitHub's
        # expression syntax, and a silent expression-parse failure here
        # would defeat the whole point of this gate.
        run: |
          for result in "${{ needs['test'].result }}" "${{ needs['test-action'].result }}" "${{ needs['diffmeter-self-score'].result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::A required job did not succeed: $result"
              exit 1
            fi
          done

  test-action:
    # Exercises action.yml for real via `uses: ./` -- this was shipped in
    # v0.2.0 and, until now, only ever validated as syntactically-correct
    # YAML, never actually run in a workflow. It's the primary CI
    # integration path documented in the README, so an untested composite
    # action is a real gap, not a hypothetical one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create a trivial (comment-only) commit to diff against
        # Uses a throwaway .py file, not README.md: a leading "#" is a
        # comment in Python but a heading in Markdown, which tree-sitter
        # correctly treats as real content, not something trivial -- an
        # earlier version of this test used README.md and got a false
        # 100.0 score for exactly that reason, caught in a local dry run
        # before it ever reached CI.
        run: |
          git config user.email "test@example.com"
          git config user.name "CI"
          printf '# trivial comment\n' > action_test_file.py
          git add action_test_file.py
          git commit -m "trivial comment-only change"

      - name: Run action with no min-score (should just report)
        uses: ./
        with:
          base: HEAD~1

      - name: Run action with min-score against the trivial change (expect failure)
        id: trivial_gate
        continue-on-error: true
        uses: ./
        with:
          base: HEAD~1
          min-score: "50"

      - name: Assert the gate actually failed on the trivial change
        run: |
          if [ "${{ steps.trivial_gate.outcome }}" != "failure" ]; then
            echo "::error::Expected the min-score gate to fail on a comment-only change, got outcome '${{ steps.trivial_gate.outcome }}'"
            exit 1
          fi
          echo "OK: gate correctly failed on a comment-only change."

      - name: Create a substantive commit on top
        run: |
          echo "print('a genuinely new line of code')" >> action_test_file.py
          git add action_test_file.py
          git commit -m "substantive change"

      - name: Run action with min-score against the substantive change (expect success)
        uses: ./
        with:
          base: HEAD~1
          min-score: "50"

      - name: Create a trivial change to a file matched by an ignore pattern
        # Exercises the `ignore` input added alongside this job's original
        # coverage of `base`/`head`/`min-score` -- --ignore and --weight
        # shipped as CLI/library features in 0.4.0 and 0.6.0 but were never
        # wired into action.yml until now, so this was untested exactly like
        # the composite action itself was before the test-action job existed.
        run: |
          printf '# another trivial comment\n' > ignored_test_file.py
          git add ignored_test_file.py
          git commit -m "trivial change to a file the next step ignores"

      - name: Run action with the trivial file excluded via ignore (expect success)
        # Without `ignore`, this min-score gate would fail the same way the
        # earlier trivial-commit step did -- passing here is only correct
        # because the ignored file is excluded from the score, not scored
        # and happening to pass.
        uses: ./
        with:
          base: HEAD~1
          min-score: "50"
          ignore: "ignored_test_file.py"
